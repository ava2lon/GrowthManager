name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: growthmanager-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growthmanager_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d growthmanager_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/growthmanager_ci
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/growthmanager_ci
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/growthmanager_ci
      AUTH_SECRET: ci-only-not-a-production-secret
      AUTH_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:deploy

      - name: PostgreSQL tenant-isolation tests
        run: npm run test:integration

      - name: Production build
        run: npm run build
