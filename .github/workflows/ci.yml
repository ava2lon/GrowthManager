name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: growthmanager-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growthmanager_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d growthmanager_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growthmanager_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/growthmanager_ci
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/growthmanager_test_ci
      AUTH_SECRET: ci-only-not-a-production-secret
      AUTH_URL: http://localhost:3000
      INTEGRATION_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INTEGRATION_ENCRYPTION_KEY_ID: ci-test-key
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Create disposable tenant-test database
        run: createdb --host=localhost --username=postgres growthmanager_test_ci
        env:
          PGPASSWORD: postgres

      - name: Apply migrations to disposable tenant-test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growthmanager_test_ci
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/growthmanager_test_ci

      - name: Create disposable Prisma shadow database
        run: createdb --host=localhost --username=postgres growthmanager_shadow_ci
        env:
          PGPASSWORD: postgres

      - name: Verify migrations match the Prisma data model
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/growthmanager_shadow_ci

      - name: Install PostgreSQL client for migration recovery tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Test idempotent migration recovery and populated-data preservation
        run: bash scripts/test-migration-recovery.sh
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/growthmanager_test_ci

      - name: PostgreSQL tenant-isolation tests
        run: npm run test:integration

      - name: Production build
        run: npm run build
