name: GrowthManager scheduled publishing

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growthmanager-scheduled-publishing
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke scheduled publishing worker
        env:
          CRON_SECRET: ${{ secrets.GROWTHMANAGER_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error             --max-time 75             -H "Authorization: Bearer $CRON_SECRET"             "https://growthmanager.vercel.app/api/cron/social-publishing"
