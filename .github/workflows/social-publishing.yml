name: GrowthManager scheduled publishing

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growthmanager-scheduled-publishing
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Invoke scheduled publishing worker
        env:
          CRON_SECRET: ${{ secrets.GROWTHMANAGER_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error             --max-time 75             -H "Authorization: Bearer $CRON_SECRET"             "https://growthmanager.vercel.app/api/cron/social-publishing"

      - name: Process one due social media upload or publish stage
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.GROWTHMANAGER_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 55 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://growthmanager.vercel.app/api/cron/social-media-processing"

      - name: Process one due social analytics retry
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.GROWTHMANAGER_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 55 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://growthmanager.vercel.app/api/cron/social-analytics-retries"

      - name: Refresh one bounded batch of social analytics snapshots
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.GROWTHMANAGER_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 55 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://growthmanager.vercel.app/api/cron/social-analytics"

      - name: Sync one connected n8n integration execution history
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.GROWTHMANAGER_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 50 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://growthmanager.vercel.app/api/cron/n8n-executions"

      - name: Dispatch content review email outbox
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.GROWTHMANAGER_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 50 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://growthmanager.vercel.app/api/cron/content-review-emails"

      - name: Evaluate automation alert policies and deliver notifications
        if: ${{ !cancelled() }}
        env:
          CRON_SECRET: ${{ secrets.GROWTHMANAGER_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 50 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://growthmanager.vercel.app/api/cron/automation-alerts"
